name: Build library distro (wheels + sdist)

# Builds platform-specific wheels of the `elysium` library plus a
# universal sdist, ready for `pip install` or PyPI upload.
#
# maturin produces an abi3 wheel (Python ≥ 3.10) so each platform
# needs just one wheel — not one per Python minor version.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # for attaching wheels to a Release on tag push

jobs:
  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: macos-arm64
          # macos-13 was retired by GitHub (Dec 2025) — jobs queue forever.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            elysium-native/target
          key: cargo-${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('elysium-native/**/Cargo.lock', 'elysium-native/**/Cargo.toml') }}

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libfontconfig1-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Build wheel (manylinux on Linux, native elsewhere)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist-wheels
          manylinux: ${{ runner.os == 'Linux' && '2_28' || 'auto' }}
          # The manylinux_2_28 container is minimal — Skia links against
          # fontconfig/freetype, so install their dev packages first.
          #
          # AlmaLinux 8 (what manylinux_2_28 is built on) ships FreeType 2.9.1,
          # and Skia 0.78 calls FT_Palette_Data_Get, FT_Palette_Select and
          # FT_Get_Color_Glyph_Layer — all added in FreeType 2.10.0. A shared
          # object may keep undefined symbols, so the link SUCCEEDS and the
          # failure only appears when something dlopens the module:
          #
          #   ImportError: .../_native.abi3.so: undefined symbol: FT_Palette_Data_Get
          #
          # auditwheel then vendors the container's 2.9.1 into elysium_ui.libs/,
          # so the wheel ships a module and a dependency that disagree. That is
          # what broke the 1.2.0 Linux wheel.
          #
          # Building a newer FreeType over the system copy fixes both halves:
          # the link resolves against it, and auditwheel vendors it.
          # Deliberately NOT fixed by bumping to manylinux_2_34 (AlmaLinux 9,
          # FreeType 2.10.4) — that raises the glibc floor from 2.28 to 2.34 and
          # would silently drop Ubuntu 20.04 and Debian 11. Nor by skia-safe's
          # `embed-freetype`, which leaves the cached Skia prebuilts and forces
          # the from-source build called out in elysium-native/Cargo.toml.
          before-script-linux: |
            set -euo pipefail
            dnf install -y fontconfig-devel freetype-devel libpng-devel bzip2-devel || \
              yum install -y fontconfig-devel freetype-devel libpng-devel bzip2-devel

            FT_VER=2.13.3
            curl -fsSL --retry 3 -o "freetype-${FT_VER}.tar.gz" \
              "https://download.savannah.gnu.org/releases/freetype/freetype-${FT_VER}.tar.gz"
            tar xzf "freetype-${FT_VER}.tar.gz"
            cd "freetype-${FT_VER}"
            # harfbuzz (autohint) and brotli (WOFF2) are optional helpers we do
            # not need; skipping them avoids pulling more deps into the image.
            ./configure --prefix=/usr --libdir=/usr/lib64 \
                        --enable-shared --disable-static \
                        --with-harfbuzz=no --with-brotli=no
            make -j"$(nproc)"
            make install
            ldconfig
            cd ..

            # Fail inside the container rather than shipping another wheel with
            # this defect.
            for sym in FT_Palette_Data_Get FT_Palette_Select FT_Get_Color_Glyph_Layer; do
              nm -D --defined-only /usr/lib64/libfreetype.so.6 | grep -q "$sym" || {
                echo "::error::rebuilt FreeType still lacks $sym"; exit 1; }
            done
            echo "FreeType $(pkg-config --modversion freetype2) provides the COLR APIs Skia needs"

      # The wheel was never loaded before being published. `import elysium` is
      # not sufficient on its own: python/elysium/__init__.py catches the
      # ImportError from the native extension and continues with
      # _NATIVE_AVAILABLE = False, which is why 1.2.0's broken Linux wheel
      # sailed through the post-publish version check.
      - name: Verify the built wheel actually loads its native extension
        shell: bash
        run: |
          set -euo pipefail
          whl=$(ls dist-wheels/*.whl | head -1)
          echo "installing $whl"
          python -m pip install --force-reinstall "$whl"
          python - <<'PY'
          import elysium
          if not elysium._NATIVE_AVAILABLE:
              raise SystemExit(
                  "::error::native extension failed to import: "
                  f"{getattr(elysium, '_import_error', 'unknown')}")
          from elysium._native import _native as n
          print("native extension loaded OK, version", n.__version__)
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: elysium-wheel-${{ matrix.artifact }}
          path: dist-wheels/*.whl
          if-no-files-found: error
          retention-days: 30

  sdist:
    name: sdist (universal source distribution)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist-wheels
      - uses: actions/upload-artifact@v7
        with:
          name: elysium-sdist
          path: dist-wheels/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-release:
    # On a `vX.Y.Z` tag push, gather every wheel + the sdist and
    # attach them to a draft GitHub Release. Manual `workflow_dispatch`
    # runs stop after the artifact upload — releases stay opt-in via
    # tagging to avoid accidental publishes.
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir release-files
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) \
            -exec cp {} release-files/ \;
          ls -la release-files
      - uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          draft: true
          generate_release_notes: true

  publish-pypi:
    # PyPI Trusted Publishing (OIDC — no API token). Requires the "pypi"
    # environment on this repo and a Trusted Publisher entry on PyPI for the
    # elysium-ui project pointing at this repo + workflow + environment.
    # Fires only on version tags, after the GitHub release job.
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/elysium-ui/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir dist
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) \
            -exec cp {} dist/ \;
          ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Files already on PyPI (e.g. a partial earlier publish) are skipped
          # instead of failing the job.
          skip-existing: true

  verify-published:
    # Post-publish gate: install the just-published wheel from PyPI in a clean
    # environment and assert the runtime version matches the tag. This catches
    # a version-metadata desync at release time — e.g. 1.1.3 shipped a
    # 1.1.2-stamped native module and reported the wrong __version__.
    needs: [publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install from PyPI and assert __version__ == tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "expecting elysium-ui==$VERSION"
          # PyPI's index can lag the upload by a few seconds — retry.
          ok=""
          for i in $(seq 1 12); do
            if pip install --no-cache-dir "elysium-ui==$VERSION"; then ok=1; break; fi
            echo "not visible yet; retry $i"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::elysium-ui==$VERSION never became installable"; exit 1; }
          got=$(python -c "import elysium; print(elysium.__version__)")
          echo "elysium.__version__ = $got"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::published __version__ ($got) != release tag ($VERSION)"
            exit 1
          fi
          # Version alone is not proof the wheel works. __init__ swallows the
          # native extension's ImportError and falls back to
          # _NATIVE_AVAILABLE = False, so a wheel whose .so cannot load still
          # reports the right version — exactly how 1.2.0's Linux wheel passed
          # this gate while being unusable.
          python - <<'PY'
          import elysium
          if not elysium._NATIVE_AVAILABLE:
              raise SystemExit(
                  "::error::published wheel imports but its native extension does not: "
                  f"{getattr(elysium, '_import_error', 'unknown')}")
          from elysium._native import _native as n
          print("native extension loaded OK, version", n.__version__)
          PY
          echo "OK: published wheel reports the correct version and loads natively"
