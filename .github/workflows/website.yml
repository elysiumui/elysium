name: Website

# Builds the elysiumui.com marketing site and deploys it to Cloudflare Pages
# by DIRECT UPLOAD (wrangler) — no Cloudflare Git integration. The old
# git-connected "elysium" Pages project went dormant when the website source
# moved to this private repo (Pages cannot re-point a connected repository),
# so this deploys to a fresh direct-upload project. Custom-domain moves are
# handled separately by cf-domain-move.yml (attachment + DNS atomically).
#
# REQUIRED SECRETS: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit),
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: elysiumui-website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages (direct upload)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set."
            exit 1
          fi
          npx --yes wrangler@4 pages project create "$PROJECT" \
            --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy website/dist \
            --project-name="$PROJECT" --branch=main

      # Domain attachment is deliberately NOT managed here. Moving a custom
      # domain between Pages projects must happen atomically with the DNS
      # retarget or Cloudflare serves 522 (2026-07-03 incident) — that is
      # cf-domain-move.yml's job, run on demand. This workflow only deploys.
