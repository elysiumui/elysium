name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Opt every JavaScript action into Node 24 — see build-binaries.yml.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run: { working-directory: elysium-native }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "elysium-native -> target" }

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libfontconfig1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev mesa-vulkan-drivers

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-features

  python:
    name: pytest (${{ matrix.os }})
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "elysium-native -> target" }

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libfontconfig1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev mesa-vulkan-drivers

      - name: Install maturin & dev deps
        run: pip install "maturin>=1.7,<2" pytest pytest-asyncio pillow numpy

      - name: Build wheel & install in develop mode
        run: maturin develop --release

      - name: Run pytest (unit)
        run: pytest -q --ignore=tests/snapshots

      # Per-platform screenshot diff. Goldens are checked in under
      # tests/snapshots/<platform>/ and the diff job picks the right
      # set based on the runner OS. New platforms regenerate via the
      # `UPDATE_GOLDENS=1 pytest tests/snapshots` workflow_dispatch.
      - name: Screenshot diff
        if: hashFiles('tests/snapshots/**') != ''
        env:
          PYTHONUNBUFFERED: "1"
        run: pytest tests/snapshots -q

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs-${{ matrix.os }}
          path: tests/snapshots/_failed/
          if-no-files-found: ignore
