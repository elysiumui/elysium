name: Release Designer

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (defaults to the pushed tag)"
        required: false
        default: ""

# Builds the standalone Elysium Designer per OS using
# scripts/build-designer.spec, then uploads each artifact to the GitHub
# Release. The docs-designer/installation/{macos,windows,linux}.md pages
# link directly to the artifacts produced here.

# Opt every JavaScript action into Node 24 — see build-binaries.yml.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact_name: "Elysium-Designer-macOS-arm64.dmg"
            label: "macOS (Apple Silicon)"
          - os: macos-13
            artifact_name: "Elysium-Designer-macOS-x86_64.dmg"
            label: "macOS (Intel)"
          - os: windows-2022
            artifact_name: "Elysium-Designer-Windows-x64-Setup.exe"
            label: "Windows x64"
          - os: ubuntu-22.04
            artifact_name: "Elysium-Designer-Linux-x86_64.AppImage"
            label: "Linux x86_64"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install Rust toolchain
        # The native extension is maturin-built; we need a Rust toolchain
        # on every runner.
        uses: dtolnay/rust-toolchain@stable

      - name: Install build deps
        shell: bash
        run: |
          pip install pyinstaller maturin
          # Build the elysium wheel from source so the spec sees the native
          # module at its expected import path.
          pip install -e .

      - name: Pick version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "ELYSIUM_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          elif [ -n "${GITHUB_REF#refs/tags/}" ]; then
            echo "ELYSIUM_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "ELYSIUM_VERSION=dev" >> $GITHUB_ENV
          fi

      - name: PyInstaller build
        shell: bash
        env:
          ELYSIUM_ICON_MAC: ${{ secrets.ELYSIUM_ICON_MAC || '' }}
          ELYSIUM_ICON_WIN: ${{ secrets.ELYSIUM_ICON_WIN || '' }}
        run: pyinstaller scripts/build-designer.spec --noconfirm

      # --- macOS: sign + notarize + DMG --------------------------------
      - name: macOS sign + notarize + package
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PWD: ${{ secrets.APPLE_APP_PWD }}
          ELYSIUM_SIGN_ID: ${{ secrets.ELYSIUM_SIGN_ID }}
        run: |
          set -e
          APP="dist/Elysium Designer.app"
          if [ -n "$ELYSIUM_SIGN_ID" ]; then
            codesign --force --options runtime --deep --sign "$ELYSIUM_SIGN_ID" "$APP"
            ditto -c -k --keepParent "$APP" /tmp/notarize.zip
            xcrun notarytool submit /tmp/notarize.zip \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PWD" --wait
            xcrun stapler staple "$APP"
          else
            echo "WARN: no signing identity provided; shipping unsigned app"
          fi
          # Pack into a DMG for the Release upload. create-dmg gives us a
          # branded background + license; hdiutil is the fallback.
          if command -v create-dmg >/dev/null; then
            create-dmg \
              --volname "Elysium Designer" \
              --window-size 720 420 \
              --icon-size 96 \
              --app-drop-link 480 200 \
              "dist/${{ matrix.artifact_name }}" \
              "$APP"
          else
            hdiutil create -volname "Elysium Designer" \
              -srcfolder "$APP" -ov -format UDZO \
              "dist/${{ matrix.artifact_name }}"
          fi

      # --- Windows: sign + Inno Setup ----------------------------------
      - name: Windows sign + installer
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        env:
          ELYSIUM_SIGN_PFX: ${{ secrets.ELYSIUM_SIGN_PFX }}
          ELYSIUM_SIGN_PASS: ${{ secrets.ELYSIUM_SIGN_PASS }}
        run: |
          if ($Env:ELYSIUM_SIGN_PFX) {
            $pfx = "$Env:RUNNER_TEMP\\signing.pfx"
            [System.Convert]::FromBase64String($Env:ELYSIUM_SIGN_PFX) `
              | Set-Content -Path $pfx -AsByteStream
            & "C:\\Program Files (x86)\\Windows Kits\\10\\bin\\10.0.22000.0\\x64\\signtool.exe" `
              sign /fd SHA256 /f $pfx /p $Env:ELYSIUM_SIGN_PASS `
              /tr http://timestamp.digicert.com /td SHA256 `
              dist\\ElysiumDesigner.exe
          } else {
            Write-Host "WARN: no signing certificate provided"
          }
          # Build the installer with Inno Setup. If iscc is missing or fails,
          # fall back to a portable zip so a Windows artifact always uploads.
          $base = "${{ matrix.artifact_name }}" -replace '\.exe$',''
          $installer = "dist\\${{ matrix.artifact_name }}"
          $built = $false
          if (Get-Command iscc.exe -ErrorAction SilentlyContinue) {
            iscc.exe scripts\\windows-installer.iss /F"$base"
            if (Test-Path $installer) { $built = $true }
            else { Write-Host "WARN: Inno Setup did not produce $installer" }
          } else {
            Write-Host "WARN: iscc.exe not found"
          }
          if (-not $built) {
            Write-Host "Falling back to a portable zip."
            Compress-Archive -Force -Path dist\\ElysiumDesigner.exe `
              -DestinationPath "dist\\$base-portable.zip"
          }

      # --- Linux: AppImage + .deb + .rpm -------------------------------
      - name: Linux AppImage
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libfuse2
          curl -L -o /tmp/appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool.AppImage
          mkdir -p AppDir/usr/bin
          cp -r dist/ElysiumDesigner/* AppDir/usr/bin/
          cat > AppDir/elysium-designer.desktop <<EOF
          [Desktop Entry]
          Name=Elysium Designer
          Exec=ElysiumDesigner
          Icon=elysium-designer
          Type=Application
          Categories=Graphics;
          EOF
          # Placeholder icon; release pipeline replaces with branded icon.
          touch AppDir/elysium-designer.png
          /tmp/appimagetool.AppImage AppDir "dist/${{ matrix.artifact_name }}"

      - name: Upload artifact to Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact_name }}
            dist/*-portable.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
