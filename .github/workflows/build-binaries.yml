name: Build single-file binaries (Designer + examples)

# Run on demand or on a release tag. PyInstaller cannot cross-compile —
# this matrix runs one job per OS so the artifacts come from a real
# matching runner.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated list. Use 'all' to build everything."
        default: "designer,example:hello,example:butterfly,example:components,example:agent-cursor,example:snapshot-relay"
        required: true
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.os }}  ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        target:
          - designer
          - example:hello
          - example:butterfly
          - example:components
          - example:agent-cursor
          - example:snapshot-relay
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            elysium-native/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('elysium-native/**/Cargo.lock') }}

      - name: Install Linux GUI deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libfontconfig1 libfreetype6

      - name: Install Python deps + maturin
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Parse target
        id: parse
        shell: bash
        run: |
          t="${{ matrix.target }}"
          if [ "$t" = "designer" ]; then
            echo "kind=designer" >> "$GITHUB_OUTPUT"
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "label=Designer" >> "$GITHUB_OUTPUT"
          else
            name="${t#example:}"
            echo "kind=example" >> "$GITHUB_OUTPUT"
            echo "name=$name" >> "$GITHUB_OUTPUT"
            echo "label=example-$name" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        shell: bash
        run: |
          if [ "${{ steps.parse.outputs.kind }}" = "designer" ]; then
            python scripts/build.py designer --clean
          else
            python scripts/build.py example "${{ steps.parse.outputs.name }}" --clean
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elysium-${{ steps.parse.outputs.label }}-${{ matrix.os }}
          path: dist/**/*
          if-no-files-found: error
          retention-days: 14

  release:
    # If this run was triggered by a vX.Y.Z tag, attach every artifact
    # to a GitHub Release. Otherwise this job is skipped.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show what we have
        run: find artifacts -type f -printf '%p  %s bytes\n'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
